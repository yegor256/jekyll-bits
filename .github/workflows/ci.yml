name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@7b48e00e99515f8a6ecb53459862caa9fb0da7ad
        with:
          ruby-version: '3.4'
          bundler: '2.6.8'
          bundler-cache: true
      - run: bundle exec rake
