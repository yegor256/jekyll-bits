name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@91db960ceecd2bc56bbc2f5e4ae5f7641ca7474d
        with:
          ruby-version: '4.0'
          bundler: '4.1.0'
          bundler-cache: true
      - run: bundle exec rake
